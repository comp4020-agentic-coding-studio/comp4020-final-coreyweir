# Ported from the old VPS deploy (collab_riff ansible riff-app.conf.j2):
# TLS is terminated by fly's proxy, so this listens on plain HTTP $PORT.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { text/javascript mjs; application/wasm wasm; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/wasm application/json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A room's preview (docs/adr/0011): <label>.preview.airiff.tech, on
    # this same app. Everything goes to the node server, which answers the
    # preview relay and refuses the rest, so no app file, API route, sign-in
    # or socket of Riff's is reachable on a preview host. The relay sets
    # each response's own headers (COEP, CORP) so Riff's isolated page can
    # frame it.
    server {
        listen 8080;
        server_name ~^.+\.preview\.;

        location / {
            proxy_http_version 1.1;
            # $http_host, not $host: node matches the preview origin with its
            # port (http://<label>.preview.localhost:8080 in CI), and $host
            # drops it, so the preview was served as Riff there. On fly the
            # Host has no port and the two are the same.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # the relay caps a request body at 1 MB itself
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:8093;
        }
    }

    # Riff itself, and any Host that isn't a preview's.
    server {
        listen 8080 default_server;
        root /srv/www;
        index index.html;

        # Nodepod needs SharedArrayBuffer, so the app is cross-origin isolated.
        # upgrade-insecure-requests: the guest's plain-http requests leave
        # through this page's fetch() (src/netGatewayBrowser.ts), and an https
        # page blocks plain-http fetches as mixed content. The browser sends
        # them over https instead. Not set in Vite's dev server: on
        # http://127.0.0.1 it would upgrade the page's own asset requests.
        location = /index.html {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header Content-Security-Policy "upgrade-insecure-requests";
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header Content-Security-Policy "upgrade-insecure-requests";
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /readme/ {
            try_files $uri $uri/index.html =404;
        }

        # Everything the node server answers: the relays, the room documents
        # (the client opens bare /collaboration), the API and the GitHub
        # sign-in routes (/auth/github/start and the /auth callback).
        location ~ ^/(room-preview/|preview-control/|terminal/|collaboration(/|$)|api/|auth(/|$)) {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Claude sends the whole conversation with every model request
            # (docs/adr/0009), past nginx's 1 MB default. The node routes
            # that read a body cap it themselves.
            client_max_body_size 32m;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://127.0.0.1:8093;
        }

        location / {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header Content-Security-Policy "upgrade-insecure-requests";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri /index.html;
        }
    }
}
