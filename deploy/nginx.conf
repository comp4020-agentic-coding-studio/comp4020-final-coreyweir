# Ported from the old VPS deploy (collab_riff ansible riff-app.conf.j2):
# TLS is terminated by fly's proxy, so this listens on plain HTTP $PORT.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { text/javascript mjs; application/wasm wasm; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/wasm application/json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        root /srv/www;
        index index.html;

        # Nodepod needs SharedArrayBuffer, so the app is cross-origin isolated.
        location = /index.html {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /readme/ {
            try_files $uri $uri/index.html =404;
        }

        location ~ ^/(room-preview/|preview-control/|terminal/|collaboration/|api/) {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://127.0.0.1:8093;
        }

        location / {
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri /index.html;
        }
    }
}
